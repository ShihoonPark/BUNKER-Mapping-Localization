ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_tf: false
    publish_acceleration: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # The source bag covariances are all zero. The adapter publishes separate messages with
    # explicit initial-tuning assumptions; original topics remain unchanged.
    odom0: /localization/odom_with_covariance
    # State order: x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # z/roll/pitch are deliberately not constrained to the bag's zero values because the map
    # includes a ramp and stage. Full 6DoF correction remains the responsibility of GICP.
    odom0_config: [true, true, false,
                   false, false, true,
                   true, false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 200
    odom0_differential: false
    # The localizer consumes only EKF relative motion. Zero the first odom pose so an arbitrary
    # recorder/robot odom origin cannot enter the filter later as a delayed absolute-pose jump
    # when IMU happens to initialize the filter before odometry.
    odom0_relative: true
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0

    imu0: /localization/imu_with_covariance
    # Fixed identity orientation and linear acceleration are not fused. Only gyro yaw rate is.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 500
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_angular_velocity_rejection_threshold: 5.0
